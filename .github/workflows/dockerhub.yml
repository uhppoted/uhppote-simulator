name: dockerhub

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:

  build:
    name: Push uhppoted-simulator container to dockerhub
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache: false

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Build Docker image
      run: |
        make docker-dockerhub
        docker images

    - name: Docker login to dockerhub
      run: |
        echo "${{ secrets.DOCKERHUB }}" | docker login -u uhppoted --password-stdin

    - name: Push Docker 'latest' image to dockerhub
      run: |
        docker push uhppoted/simulator:latest

    - name: Push versioned Docker image to dockerhub
      if: github.event_name == 'release' && github.event.action == 'published'
      run: |
        TAG="${{ github.event.release.tag_name }}"
        VERSION=${TAG#v}
        echo ">>>>>> build Docker image version ${VERSION}"
        make docker-ghcr DOCKER=uhppoted/simulator:${VERSION}
        docker images
        docker push uhppoted/simulator:${VERSION}
